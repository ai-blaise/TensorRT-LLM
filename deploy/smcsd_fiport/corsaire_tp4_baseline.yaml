# Correctness-reference TP4 config for the Corsaire target.
#
# Same topology, storage format, and indexer as corsaire_tp4.yaml. The ONLY
# things varied are the custom compute kernels and the fp8 KV cache, so this
# run isolates "is a custom kernel computing the wrong thing?".
#
# Varied (turned off here):
#   - WARPDECODE MoE -> stock CUTLASS, and low-precision MoE combine off
#   - CuTe DSL kernels: blockscaling bmm, bf16 bmm, topk, paged MQA logits
#   - CUDA graph capture/replay
#   - overlap scheduler
#   - fp8 KV cache -> auto
#
# Held constant (identical to corsaire_tp4.yaml):
#   - DSA sparse attention (required by the architecture)
#   - KVarN 2-bit latent KV (kvarn_k2v2 + amortize)
#   - indexer: indexcache-hisa, fp4 indexer K, all hisa_* settings
#
#   clean here       -> a custom kernel above is corrupting logits;
#                       re-enable them one at a time.
#   garbage here too -> cause is KVarN, the indexer, the weights, the
#                       tokenizer, the loader, or TP4 sharding.
#
# A clean run does NOT exonerate the weights, tokenizer, KVarN, or the
# indexer -- all of those are still active. Bisect those separately, e.g.
# flip only mla_latent_kv_dtype to kvarn_k4v4 (same code path, 4-bit).
#
# Do NOT use this for benchmarks; it is slow on purpose.
backend: pytorch
tensor_parallel_size: 4
moe_expert_parallel_size: 4
enable_attention_dp: false
trust_remote_code: true
enable_chunked_prefill: true
disable_overlap_scheduler: true
allreduce_strategy: AUTO

# Stock BMM kernels instead of the CuTe DSL paths.
use_cute_dsl_blockscaling_bmm: false
use_cute_dsl_bf16_bmm: false

max_batch_size: 8
max_input_len: 8192
max_seq_len: 8448
max_num_tokens: 2048
print_iter_log: false
stream_interval: 1
num_postprocess_workers: 1

# CUDA graphs off: capture/replay is its own failure surface.
cuda_graph_config: null

kv_cache_config:
  # No fp8 KV quantization.
  dtype: auto
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.45
  tokens_per_block: 64

moe_config:
  # Stock CUTLASS MoE instead of the Blaise output-owned NVFP4 WarpDecode path.
  backend: CUTLASS
  use_low_precision_moe_combine: false

# Held constant: these are all stock NVIDIA GEMM backends, not Blaise custom
# kernels. Pinned explicitly so backend selection is not left to a default.
nvfp4_gemm_config:
  allowed_backends: [cutlass, cublaslt, cuda_core]

sparse_attention_config:
  # DSA itself is required by the DeepSeek-V3.2-style architecture and cannot
  # be removed; everything layered on top of it can be.
  algorithm: dsa
  # Indexer HELD CONSTANT, identical to corsaire_tp4.yaml. Note that pinning
  # indexer_mode to "vanilla" would not reliably take effect anyway: when the
  # HF model config asks for indexcache/indexcache-hisa, model_config.py
  # L828-L835 promotes "vanilla" back and overrides indexer_k_dtype and
  # enable_nvfp4_hisa with it.
  indexer_mode: indexcache-hisa
  index_n_heads: 64
  index_head_dim: 128
  index_topk: 1024
  index_topk_pattern: FSSS
  index_topk_freq: 4
  indexer_k_dtype: fp4
  # HELD CONSTANT, identical to corsaire_tp4.yaml. KVarN is deliberately NOT
  # part of this baseline's variable set, so it is not ruled out by a clean
  # run here -- bisect it separately (kvarn_k4v4 next).
  # Do not "disable" this by writing `auto`: in this fork auto/None is the
  # sentinel that re-selects the kvarn_k2v2 default
  # (model_config.py:L814-L817 + L154). Only a literal non-kvarn dtype
  # reaches the else-branch at L819.
  mla_latent_kv_dtype: kvarn_k2v2
  mla_latent_kv_amortize: true
  # HISA HELD CONSTANT too: it is validated as part of the indexer (it
  # requires indexer_mode=indexcache-hisa and indexer_k_dtype=fp4), and
  # hisa_min_seq_len gates it to >=65536 tokens, so it is inert for any
  # short diagnostic prompt regardless.
  enable_nvfp4_hisa: true
  hisa_block_size: 128
  hisa_block_topk: 64
  hisa_compression_ratio: 4.0
  hisa_min_seq_len: 65536
  hisa_execution_mode: optimized
  # These two are CuTe DSL kernel selectors, not indexer configuration, so
  # they stay off with the rest of the custom kernels.
  use_cute_dsl_topk: false
  use_cute_dsl_paged_mqa_logits: false
  layersplit_enabled: false
